<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Apartment cleaning management forms">
  <title>Cleaning Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Password Gate -->
  <div id="password-gate" class="password-overlay">
    <div class="password-card">
      <h1>Enter Password</h1>
      <p>Please enter the password to continue</p>
      <input type="password" id="password-input" placeholder="Password" autofocus>
      <button id="password-submit" class="btn-primary">Continue</button>
      <p id="password-error" class="error-text"></p>
    </div>
  </div>

  <!-- Main Content -->
  <main id="main-content" class="main-content hidden">
    <header class="header">
      <h1>Cleaning Management</h1>
      <p>Submit cleaning requests and manager reports</p>
    </header>

    <div class="cards-container">
      <!-- Form 1: Cleaning Request -->
      <section class="card">
        <h2>Cleaning Request</h2>
        <form id="form-one">
          <div class="form-group">
            <label for="apartment-name">Apartment Name</label>
            <input type="text" id="apartment-name" name="apartmentName" placeholder="e.g. Suite 204" required>
          </div>
          <div class="form-group">
            <label for="cleaning-date">Cleaning Date</label>
            <input type="date" id="cleaning-date" name="cleaningDate" required>
          </div>
          <div class="form-group">
            <label for="cleaning-type">Cleaning Type</label>
            <select id="cleaning-type" name="cleaningType" required>
              <option value="">Select type</option>
              <option value="light">Light</option>
              <option value="standard">Standard</option>
              <option value="deep">Deep</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
      </section>

      <!-- Form 2: Manager Report -->
      <section class="card">
        <h2>Manager Report</h2>
        <form id="form-two">
          <div class="form-group">
            <label for="manager-name">Manager Name</label>
            <input type="text" id="manager-name" name="managerName" placeholder="e.g. John Smith" required>
          </div>
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" placeholder="Enter your comment" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
