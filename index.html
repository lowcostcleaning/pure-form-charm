<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cleaning Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --blue: #0a66ff;
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1, h2 {
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    textarea { resize: vertical; min-height: 80px; }

    button {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { opacity: .95; }

    /* app layout */
    .app {
      padding: 40px;
      max-width: 1200px;
      margin: auto;
      display: none;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="login" class="center">
  <div class="card">
    <h2>Enter Password</h2>
    <p>Please enter the password to continue</p>
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Continue</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <div class="header">
    <h1>Cleaning Management</h1>
    <p>Submit cleaning requests and manager reports</p>
  </div>

  <div class="grid">
    <!-- Cleaning Request -->
    <div class="card">
      <h2>Cleaning Request</h2>

      <input id="apt" placeholder="Apartment Name (e.g. Suite 204)" />
      <input id="date" type="date" />
      <select id="type">
        <option value="">Select type</option>
        <option>Light</option>
        <option>Standard</option>
        <option>Deep</option>
      </select>

      <button onclick="submitCleaning()">Submit</button>
    </div>

    <!-- Manager Report -->
    <div class="card">
      <h2>Manager Report</h2>

      <input id="manager" placeholder="Manager Name" />
      <input id="amount" type="number" step="0.01" placeholder="0.00" />
      <textarea id="comment" placeholder="Enter your comment"></textarea>

      <button onclick="submitReport()">Submit</button>
    </div>
  </div>
</div>

<script>
  const SITE_PASSWORD = "demo123";

  function login() {
    const value = document.getElementById("password").value;
    if (value === SITE_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      alert("Wrong password");
    }
  }

  function submitCleaning() {
    const data = {
      apartment: apt.value,
      date: date.value,
      type: type.value
    };
    console.log("Cleaning Request:", data);
    alert("Cleaning request submitted");
  }

  function submitReport() {
    const data = {
      manager: manager.value,
      amount: amount.value,
      comment: comment.value
    };
    console.log("Manager Report:", data);
    alert("Report submitted");
  }
</script>

</body>
</html>
