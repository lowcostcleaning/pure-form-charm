<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Панель отчётов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --blue: #0a66ff;
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --radius: 18px;
      --shadow: 0 12px 32px rgba(0,0,0,.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%;
    }

    .login-card {
      max-width: 420px;
    }

    h1, h2 {
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .app {
      display: none;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }
  </style>
</head>

<body>

<!-- 🔐 ВХОД -->
<div id="login" class="center">
  <div class="card login-card">
    <h2>Введите пароль</h2>
    <p>Для доступа к отчётам</p>
    <input type="password" id="password" placeholder="Пароль" />
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- 📋 ПАНЕЛЬ -->
<div id="app" class="app">
  <div class="header">
    <h1>Панель отчётов</h1>
    <p>Ремонт и клининг</p>
  </div>

  <div class="grid">

    <!-- 🛠 РЕМОНТ -->
    <div class="card">
      <h2>Отчёт по ремонту</h2>

      <input id="repair-apt" placeholder="Апартамент (например, 204)" />

      <label>Фото</label>
      <input id="repair-photos" type="file" accept="image/*" multiple />

      <label>Видео</label>
      <input id="repair-videos" type="file" accept="video/*" multiple />

      <button onclick="submitForm('ремонт')">Отправить</button>
    </div>

    <!-- 🧹 КЛИНИНГ -->
    <div class="card">
      <h2>Отчёт по клинингу</h2>

      <input id="clean-apt" placeholder="Апартамент (например, 204)" />

      <label>Фото</label>
      <input id="clean-photos" type="file" accept="image/*" multiple />

      <label>Видео</label>
      <input id="clean-videos" type="file" accept="video/*" multiple />

      <button onclick="submitForm('клининг')">Отправить</button>
    </div>

  </div>
</div>

<script>
  const SITE_PASSWORD = "demo123";

  // 🔴 ВСТАВЬ СЮДА PRODUCTION WEBHOOK
  const WEBHOOK_URL =
    "https://vm62681.vpsone.xyz/webhook-test/a8f1756b-b8eb-426d-b24c-aa0705fa6f65";

  function login() {
    const value = document.getElementById("password").value;
    if (value === SITE_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      alert("Неверный пароль");
    }
  }

  async function submitForm(type) {
    const apt =
      type === "ремонт"
        ? document.getElementById("repair-apt").value
        : document.getElementById("clean-apt").value;

    const photos =
      type === "ремонт"
        ? document.getElementById("repair-photos").files
        : document.getElementById("clean-photos").files;

    const videos =
      type === "ремонт"
        ? document.getElementById("repair-videos").files
        : document.getElementById("clean-videos").files;

    if (!apt) {
      alert("Укажите апартамент");
      return;
    }

    const formData = new FormData();
    formData.append("тип_отчёта", type);
    formData.append("апартамент", apt);
    formData.append("timestamp", new Date().toISOString());

    for (const f of photos) formData.append("photos", f);
    for (const f of videos) formData.append("videos", f);

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      const text = await res.text();
      console.log("STATUS:", res.status, "RESPONSE:", text);

      if (res.status !== 200) {
        alert("Ошибка сервера");
        return;
      }

      alert("Отчёт успешно отправлен");

    } catch (e) {
      console.error(e);
      alert("Ошибка соединения");
    }
  }
</script>

</body>
</html>
