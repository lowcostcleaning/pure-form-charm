<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Отчёты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --blue: #0a66ff;
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --radius: 18px;
      --shadow: 0 12px 32px rgba(0,0,0,.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- ВХОД ---------- */
    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%;
    }

    .login-card {
      max-width: 420px;
    }

    h1, h2 {
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: .95;
    }

    /* ---------- ПРИЛОЖЕНИЕ ---------- */
    .app {
      display: none;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 24px 16px 40px;
      }
    }
  </style>
</head>

<body>

<!-- 🔐 ВХОД ПО ПАРОЛЮ -->
<div id="login" class="center">
  <div class="card login-card">
    <h2>Введите пароль</h2>
    <p>Для продолжения введите пароль</p>
    <input type="password" id="password" placeholder="Пароль" />
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- 📋 ПАНЕЛЬ ОТЧЁТОВ -->
<div id="app" class="app">
  <div class="header">
    <h1>Панель отчётов</h1>
    <p>Отчёты по ремонту и клинингу</p>
  </div>

  <div class="grid">

    <!-- 🛠 ОТЧЁТ РЕМОНТ -->
    <div class="card">
      <h2>Отчёт по ремонту</h2>

      <input id="repair-apt" placeholder="Апартамент (например, 204)" />

      <label>Фото</label>
      <input id="repair-photos" type="file" accept="image/*" multiple />

      <label>Видео</label>
      <input id="repair-videos" type="file" accept="video/*" multiple />

      <button onclick="submitRepair()">Отправить</button>
    </div>

    <!-- 🧹 ОТЧЁТ КЛИНИНГ -->
    <div class="card">
      <h2>Отчёт по клинингу</h2>

      <input id="clean-apt" placeholder="Апартамент (например, 204)" />

      <label>Фото</label>
      <input id="clean-photos" type="file" accept="image/*" multiple />

      <label>Видео</label>
      <input id="clean-videos" type="file" accept="video/*" multiple />

      <button onclick="submitCleaning()">Отправить</button>
    </div>

  </div>
</div>

<script>
  const SITE_PASSWORD = "demo123";

  const REPAIR_WEBHOOK =
    "https://vm62681.vpsone.xyz/webhook-test/a8f1756b-b8eb-426d-b24c-aa0705fa6f65";

  function login() {
    const value = document.getElementById("password").value;
    if (value === SITE_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      alert("Неверный пароль");
    }
  }

  async function submitRepair() {
    const apartment = document.getElementById("repair-apt").value;
    const photos = document.getElementById("repair-photos").files;
    const videos = document.getElementById("repair-videos").files;

    if (!apartment) {
      alert("Укажите апартамент");
      return;
    }

    const formData = new FormData();
    formData.append("тип_отчёта", "ремонт");
    formData.append("апартамент", apartment);
    formData.append("timestamp", new Date().toISOString());

    for (const file of photos) {
      formData.append("photos", file);
    }

    for (const file of videos) {
      formData.append("videos", file);
    }

    try {
      const res = await fetch(REPAIR_WEBHOOK, {
        method: "POST",
        body: formData
      });

      if (!res.ok) throw new Error("Webhook error");

      alert("Отчёт по ремонту отправлен");
      document.getElementById("repair-apt").value = "";
      document.getElementById("repair-photos").value = "";
      document.getElementById("repair-videos").value = "";
    } catch (err) {
      console.error(err);
      alert("Ошибка отправки отчёта");
    }
  }
</script>


</body>
</html>
