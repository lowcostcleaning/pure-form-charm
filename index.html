<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Reports Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --blue: #0a66ff;
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --radius: 18px;
      --shadow: 0 12px 32px rgba(0,0,0,.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    /* -------- login -------- */
    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%;
    }

    .login-card {
      max-width: 420px;
    }

    h1, h2 {
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: .95;
    }

    /* -------- app -------- */
    .app {
      display: none;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 24px 16px 40px;
      }
    }
  </style>
</head>

<body>

<!-- 🔐 PASSWORD -->
<div id="login" class="center">
  <div class="card login-card">
    <h2>Enter Password</h2>
    <p>Please enter the password to continue</p>
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Continue</button>
  </div>
</div>

<!-- 📋 APP -->
<div id="app" class="app">
  <div class="header">
    <h1>Reports Dashboard</h1>
    <p>Repair & Cleaning reports</p>
  </div>

  <div class="grid">

    <!-- 🛠️ REPAIR REPORT -->
    <div class="card">
      <h2>Repair Report</h2>

      <input id="repair-apt" placeholder="Apartment (e.g. 204)" />
      <input id="repair-date" type="date" />

      <label>Photos</label>
      <input id="repair-photos" type="file" accept="image/*" multiple />

      <label>Videos</label>
      <input id="repair-videos" type="file" accept="video/*" multiple />

      <button onclick="submitRepair()">Submit</button>
    </div>

    <!-- 🧹 CLEANING REPORT -->
    <div class="card">
      <h2>Cleaning Report</h2>

      <input id="clean-apt" placeholder="Apartment (e.g. 204)" />
      <input id="clean-date" type="date" />

      <label>Photos</label>
      <input id="clean-photos" type="file" accept="image/*" multiple />

      <label>Videos</label>
      <input id="clean-videos" type="file" accept="video/*" multiple />

      <button onclick="submitCleaning()">Submit</button>
    </div>

  </div>
</div>

<script>
  /* 🔐 PASSWORD */
  const SITE_PASSWORD = "demo123";

  function login() {
    const value = document.getElementById("password").value;
    if (value === SITE_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      alert("Wrong password");
    }
  }

  /* 📎 FILES INFO (for now) */
  function filesInfo(files) {
    return Array.from(files).map(f => ({
      name: f.name,
      size: f.size,
      type: f.type
    }));
  }

  /* 🛠️ REPAIR */
  function submitRepair() {
    const data = {
      report: "repair",
      apartment: document.getElementById("repair-apt").value,
      date: document.getElementById("repair-date").value,
      photos: filesInfo(document.getElementById("repair-photos").files),
      videos: filesInfo(document.getElementById("repair-videos").files)
    };

    console.log("Repair report:", data);
    alert("Repair report submitted");
  }

  /* 🧹 CLEANING */
  function submitCleaning() {
    const data = {
      report: "cleaning",
      apartment: document.getElementById("clean-apt").value,
      date: document.getElementById("clean-date").value,
      photos: filesInfo(document.getElementById("clean-photos").files),
      videos: filesInfo(document.getElementById("clean-videos").files)
    };

    console.log("Cleaning report:", data);
    alert("Cleaning report submitted");
  }
</script>

</body>
</html>
