<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Панель отчётов</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#0a66ff;
  --bg:#f4f5f7;
  --card:#fff;
  --border:#d1d5db;
  --text:#111827;
  --muted:#6b7280;
  --radius:18px;
  --shadow:0 12px 32px rgba(0,0,0,.08);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;width:100%}
.login-card{max-width:420px}
input,textarea{width:100%;padding:14px 16px;margin-bottom:16px;border-radius:14px;border:1px solid var(--border);font-size:15px}
input[type=file]{padding:10px}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
button{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{opacity:.95}

.app{display:none;max-width:1200px;margin:auto;padding:40px 24px}
.header{text-align:center;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
</style>
</head>

<body>

<!-- 🔐 ВХОД -->
<div id="login" class="center">
  <div class="card login-card">
    <h2>Введите пароль</h2>
    <p style="color:#6b7280">Для доступа к отчётам</p>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- 📋 ПАНЕЛЬ -->
<div id="app" class="app">
  <div class="header">
    <h1>Панель отчётов</h1>
    <p style="color:#6b7280">Ремонт и клининг</p>
  </div>

  <div class="grid">

    <!-- 🛠 РЕМОНТ -->
    <div class="card">
      <h2>Отчёт по ремонту</h2>

      <form
        action="https://vm62681.vpsone.xyz/webhook-test/remont"
        method="POST"
        enctype="multipart/form-data"
        onsubmit="beforeSend('repair')"
      >
        <input type="hidden" name="тип" value="ремонт">
        <input type="hidden" name="timestamp" id="ts1">

        <input name="апартамент" placeholder="Апартамент (например, 204)" required>

        <label>Фото</label>
        <input type="file" name="photo" accept="image/*">

        <label>Видео</label>
        <input type="file" name="video" accept="video/*">

        <button type="submit">Отправить</button>
      </form>
    </div>

    <!-- 🧹 КЛИНИНГ -->
    <div class="card">
      <h2>Отчёт по клинингу</h2>

      <form
        action="https://vm62681.vpsone.xyz/webhook-test/klining"
        method="POST"
        enctype="multipart/form-data"
        onsubmit="beforeSend('clean')"
      >
        <input type="hidden" name="тип" value="клининг">
        <input type="hidden" name="timestamp" id="ts2">

        <input name="апартамент" placeholder="Апартамент (например, 204)" required>

        <label>Фото</label>
        <input type="file" name="photo" accept="image/*">

        <label>Видео</label>
        <input type="file" name="video" accept="video/*">

        <button type="submit">Отправить</button>
      </form>
    </div>

  </div>
</div>

<script>
const SITE_PASSWORD = "demo123";

function login(){
  if(document.getElementById("password").value === SITE_PASSWORD){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert("Неверный пароль");
  }
}

function beforeSend(type){
  const ts = new Date().toISOString();
  document.getElementById("ts1").value = ts;
  document.getElementById("ts2").value = ts;

  setTimeout(() => {
    alert(
      type === "repair"
        ? "✅ Отчёт по ремонту отправлен"
        : "✅ Отчёт по клинингу отправлен"
    );
  }, 300);
}
</script>

</body>
</html>
